<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://adgrid.io/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdGrid — Canada's OOH Marketplace</title>
    <meta name="description" content="AdGrid is the self-serve marketplace connecting Canadian digital screen operators with local advertisers. Real-time pricing, full control on both sides." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AdGrid — Canada's OOH Marketplace" />
    <meta property="og:description" content="The self-serve marketplace where Canadian screen operators sell ad time and local advertisers buy it." />
    <meta property="og:image" content="/marketing/hero-gym.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AdGrid — Canada's OOH Marketplace" />
    <meta name="twitter:description" content="The self-serve marketplace where Canadian screen operators sell ad time and local advertisers buy it." />
    <meta name="twitter:image" content="/marketing/hero-gym.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "AdGrid",
        "url": "https://adgrid.io/",
        "logo": "https://adgrid.io/favicon.svg",
        "description": "AdGrid is the self-serve marketplace connecting Canadian digital screen operators with local advertisers. Real-time pricing, full control on both sides.",
        "areaServed": {
          "@type": "Country",
          "name": "Canada"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "serviceType": "Out-of-home (OOH) advertising marketplace",
        "provider": {
          "@type": "Organization",
          "name": "AdGrid"
        },
        "areaServed": {
          "@type": "Country",
          "name": "Canada"
        },
        "audience": [
          { "@type": "Audience", "audienceType": "Digital screen operators" },
          { "@type": "Audience", "audienceType": "Local advertisers" }
        ],
        "offers": {
          "@type": "Offer",
          "description": "Self-serve, real-time-priced digital out-of-home ad bookings with no minimum spend."
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
