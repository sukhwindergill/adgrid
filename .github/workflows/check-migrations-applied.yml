name: Check Supabase migrations are applied

# Catches the exact class of bug found in the 2026-08-10 go-live review:
# 20260808000000_creative_qr_color_columns.sql and
# 20260731000010_campaign_creatives_media_dimensions.sql were both written,
# reviewed, and merged into main -- but neither was ever actually run
# against the live project. The first one broke campaign creation
# completely (every advertiser, every submission) for two days before
# anyone noticed. This workflow diffs supabase/migrations/ against the
# linked project's applied-migration history and fails the build if any
# local file has no matching remote entry, so that gap can never merge
# silently again.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -f supabase/config.toml || supabase init --workdir . --yes
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Fail if any migration hasn't been applied to the linked project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase migration list --linked --output-format json > migrations.json
          cat migrations.json

          # supabase migration list --output-format json returns
          # {"migrations": [...], "message": "..."} -- NOT a bare array.
          # Confirmed against real CI output on 2026-08-29 (PR #80's
          # check-migrations run): the earlier `.[]`-on-the-top-level
          # filter iterated the object's values (the array AND the
          # message string) and crashed with "Cannot index array with
          # string" the first time it hit .remote on the string. Index
          # into .migrations explicitly instead.
          pending=$(jq '[.migrations[] | select(
            ((.remote // .Remote // "") | length) == 0
          )] | length' migrations.json)

          if [ "$pending" -gt 0 ]; then
            echo "::error::${pending} migration(s) exist in supabase/migrations/ but have never been applied to the linked project (ref: ${{ secrets.SUPABASE_PROJECT_REF }})."
            echo "Apply them with 'supabase db push --linked' (or via the Supabase MCP apply_migration tool) before merging."
            jq -r '.migrations[] | select(((.remote // .Remote // "") | length) == 0) | (.local // .Local // .version // "unknown")' migrations.json
            exit 1
          fi

          echo "All $(jq '.migrations | length' migrations.json) migration(s) are applied on the linked project."
