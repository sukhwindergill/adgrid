version: "3.9"

# AdGrid Screen Agent
# Runs on any mini PC / Raspberry Pi 5 with a USB camera.
# Handles: ad display feed polling, computer vision impression tracking,
# and demographic estimation — all processing stays local.
# Only aggregated anonymous stats leave the device.
#
# Image tag is pinned to a specific commit SHA, not `latest` — CI
# (.github/workflows/docker-publish.yml) pushes every image tagged both
# `:latest` and `:<github.sha>` on every merge to main. Floating on `:latest`
# means a bad merge auto-deploys to every live screen on its next restart
# with no pinned version to roll back to. SCREEN_AGENT_TAG defaults to the
# commit that last touched screen-agent/ at the time this was pinned; bump
# it deliberately (in .env) when you want a fleet to pick up a newer build,
# never by letting it silently float.
services:
  # ── Camera capture service ─────────────────────────────────────────────────
  camera:
    image: sgill16/screen-agent-camera:${SCREEN_AGENT_TAG:-559b9a7bf32bd1067e43f3956325ceb28183f09b}
    build: ./camera
    volumes:
      - frame_data:/frames
    devices:
      - /dev/video0:/dev/video0   # USB camera — change index if needed
    environment:
      CAPTURE_FPS: "0.5"          # 1 frame every 2s — plenty for dwell/attention, cheap on CPU-only hosts
      FRAME_DIR: /frames
    restart: unless-stopped

  # ── CV inference service ───────────────────────────────────────────────────
  inference:
    image: sgill16/screen-agent-inference:${SCREEN_AGENT_TAG:-559b9a7bf32bd1067e43f3956325ceb28183f09b}
    build: ./inference
    volumes:
      - frame_data:/frames
    environment:
      FRAME_DIR: /frames
      WINDOW_SECONDS: "30"          # Aggregate stats over 30s windows
      RESULTS_DIR: /frames/results
      FRAME_INTERVAL_S: "2"         # seconds between detection passes (mediapipe) — match CAPTURE_FPS cadence
      DEMOGRAPHICS_FRAME_SKIP: "3"  # only run DeepFace age/gender (the expensive part) every Nth pass
    restart: unless-stopped
    depends_on:
      - camera

  # ── Event pusher ───────────────────────────────────────────────────────────
  pusher:
    image: sgill16/screen-agent-pusher:${SCREEN_AGENT_TAG:-559b9a7bf32bd1067e43f3956325ceb28183f09b}
    build: ./pusher
    volumes:
      - frame_data:/frames
    environment:
      SCREEN_TOKEN: "${SCREEN_TOKEN}"
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      RESULTS_DIR: /frames/results
      PUSH_INTERVAL_SECONDS: "30"
    restart: unless-stopped
    depends_on:
      - inference

volumes:
  frame_data:
